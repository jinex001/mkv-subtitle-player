# Builds the Mac apps (Apple Silicon + Intel) and publishes a GitHub release.
# Run it by pushing a tag (git tag v1.0.1 && git push origin v1.0.1)
# or from the Actions tab → Release → Run workflow.
name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag, e.g. v1.0.0'
        required: true
permissions:
  contents: write
jobs:
  mac:
    runs-on: macos-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/encoding.test.cjs
      - name: Build
        working-directory: mac
        run: |
          npm install --no-audit --no-fund
          npm run pack:arm64
          npm run pack:x64
      - name: Sign ad hoc and zip
        working-directory: mac/dist
        run: |
          V="${TAG#v}"
          for a in arm64 x64; do
            app="MKV Subtitle Player-darwin-$a/MKV Subtitle Player.app"
            codesign --force --deep --sign - "$app"
            codesign --verify --deep --strict "$app"
            ditto -c -k --sequesterRsrc --keepParent "$app" "$GITHUB_WORKSPACE/MKV-Subtitle-Player-$V-mac-$a.zip"
          done
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" MKV-Subtitle-Player-*.zip \
            --title "MKV Subtitle Player ${TAG#v}" \
            --notes-file .github/release-notes.md \
            --target "$GITHUB_SHA"
