<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; script-src 'self' file:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: file:; connect-src 'self' blob: file:">
<meta name="description" content="Play MKV videos with subtitles in your browser. Reads subtitles inside MKV files and .srt / .smi / .ass / .vtt files, detects legacy encodings automatically. Nothing is uploaded.">
<meta name="theme-color" content="#0E0F12">
<title>MKV Subtitle Player</title>
<style>
/* One dark screening room: the video on top, a slim control bar under it. Single dark theme on purpose. */
:root{
  --bg:#0E0F12; --panel:#17191E; --line:#262931; --fg:#E9E7E1; --dim:#8D8F96;
  --accent:#F2C14E; --warn:#E8805A;
  /* system fonts only: every script (Hangul, kana, Hanzi, Cyrillic…) and no network requests */
  --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,"Apple SD Gothic Neo","Hiragino Sans","PingFang SC","Microsoft YaHei","Noto Sans",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --cue:28px; --cuebg:rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--ui);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1100px;margin:0 auto;padding-block:18px 40px;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-size:17px;font-weight:700;margin:0;letter-spacing:-.01em}
h1 b{color:var(--accent);font-weight:700}
.hint{color:var(--dim);font-size:13px}
.stage{position:relative;background:#000;border-radius:14px;overflow:hidden;aspect-ratio:16/9;max-width:100%}
.stage video{width:100%;height:100%;display:block;background:#000}
video::cue{font-family:var(--ui);font-size:var(--cue);font-weight:500;line-height:1.35;color:#fff;background:var(--cuebg)}
.drop{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  text-align:center;padding:24px;border:2px dashed var(--line);border-radius:14px;color:var(--dim);cursor:pointer;background:var(--bg)}
.drop strong{color:var(--fg);font-size:18px;font-weight:700;text-wrap:balance}
.drop span{max-width:60ch;text-wrap:balance}
.drop.over{border-color:var(--accent);color:var(--fg)}
.bar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;background:var(--panel);border:1px solid var(--line);
  border-radius:14px;padding:14px 16px}
.grp{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.lbl{font-size:12px;color:var(--dim);letter-spacing:.04em}
button,.btn,select{font:inherit;font-size:14px;color:var(--fg);background:#22252C;border:1px solid var(--line);
  border-radius:9px;padding:7px 12px;cursor:pointer}
select{max-width:min(100%,15rem)}
button:hover,.btn:hover{border-color:#3a3e48}
button:focus-visible,.btn:focus-within,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chip[aria-pressed="true"]{background:var(--accent);color:#141414;border-color:var(--accent);font-weight:700}
.btn input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.btn{position:relative;display:inline-flex}
input[type=range]{accent-color:var(--accent);width:120px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;min-width:5.5ch;text-align:center}
.status{font-size:13px;color:var(--dim);min-height:1.5em}
.status.err{color:var(--warn)}
.aud{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--warn)}
.aud.ok{color:var(--fg)}
.aud span{flex:1 1 18rem;min-width:0;overflow-wrap:anywhere}
#fix{border-color:var(--accent);color:var(--accent);font-weight:700}
.prog{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.notes{color:var(--dim);font-size:13px;margin:0;padding-left:18px}
.notes li{margin:2px 0}
kbd{font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:5px;padding:0 5px}
footer{color:var(--dim);font-size:12px}
footer a{color:var(--dim)}
@media (prefers-reduced-motion:reduce){.prog i{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 data-i18n-html="appNameHtml">MKV <b>Subtitle</b> Player</h1>
    <span class="hint" id="hint" data-i18n="privacy"></span>
  </header>

  <div class="stage" id="stage">
    <video id="v" controls playsinline x-webkit-airplay="allow"></video>
    <label class="drop" id="drop" for="fv">
      <strong data-i18n="dropTitle"></strong>
      <span data-i18n="dropText"></span>
    </label>
  </div>
  <div class="prog" id="prog" hidden><i id="progi"></i></div>

  <div class="bar">
    <div class="grp">
      <label class="btn"><span data-i18n="openVideo"></span><input id="fv" type="file" accept=".mkv,.webm,.mp4,.m4v,.mov,video/*" multiple></label>
      <label class="btn"><span data-i18n="addSubs"></span><input id="fs" type="file" accept=".srt,.smi,.sami,.vtt,.ass,.ssa,text/*" multiple></label>
      <select id="enc" data-i18n-aria="encAria" data-i18n-title="encTitle"></select>
    </div>
    <div class="grp" role="group" data-i18n-aria="subsAria">
      <span class="lbl" data-i18n="subsLabel"></span>
      <span id="tracks" class="grp"></span>
    </div>
    <div class="grp">
      <span class="lbl" data-i18n="size"></span>
      <span class="grp" id="sizes" role="group" data-i18n-aria="sizeAria">
        <button class="chip" data-s="4" data-i18n="sizeS"></button>
        <button class="chip" data-s="5.5" data-i18n="sizeM"></button>
        <button class="chip" data-s="7" data-i18n="sizeL"></button>
        <button class="chip" data-s="9" data-i18n="sizeXL"></button>
      </span>
      <button id="szm" data-i18n-title="sizeDown" data-i18n-aria="sizeDown">A−</button>
      <input id="size" type="range" min="3" max="12" step="0.5" value="5.5" data-i18n-aria="sizeRange">
      <button id="szp" data-i18n-title="sizeUp" data-i18n-aria="sizeUp">A+</button>
    </div>
    <div class="grp" role="group" data-i18n-aria="syncAria">
      <span class="lbl" data-i18n="sync"></span>
      <button id="sm" data-i18n-title="syncEarlier">−0.25s</button>
      <span class="mono" id="off">0.00s</span>
      <button id="sp" data-i18n-title="syncLater">+0.25s</button>
      <button id="s0" data-i18n="reset"></button>
    </div>
    <div class="grp">
      <label class="lbl" style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="bgc" checked> <span data-i18n="subBg"></span></label>
    </div>
    <div class="grp">
      <button id="cast" hidden style="display:inline-flex;gap:7px;align-items:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M6 17H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h16a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1h-2"/><path d="M12 14l5 6H7z" fill="currentColor"/></svg><span id="castl" data-i18n="cast"></span></button>
    </div>
  </div>
  <div class="aud" id="aud" hidden>
    <span id="audt" role="status"></span>
    <button id="fix" hidden></button>
  </div>
  <div class="status" id="st" role="status"></div>

  <ul class="notes">
    <li data-i18n="noteBrowser" data-web></li>
    <li data-i18n="noteMac" data-app hidden></li>
    <li data-i18n="noteTV"></li>
    <li data-i18n="noteCodec"></li>
    <li data-i18n="noteImage"></li>
    <li><span data-i18n="keys"></span>: <kbd>Space</kbd> <span data-i18n="kPlay"></span> · <kbd>←</kbd><kbd>→</kbd> <span data-i18n="kSeek"></span> · <kbd>Z</kbd><kbd>X</kbd> <span data-i18n="kSync"></span> · <kbd>−</kbd><kbd>+</kbd> <span data-i18n="kSize"></span> · <kbd>F</kbd> <span data-i18n="kFull"></span></li>
  </ul>
  <footer data-web><a href="https://github.com/jinex001/mkv-subtitle-player">GitHub</a></footer>
</div>
<script src="i18n.js"></script>
<script src="encoding.js"></script>
<script src="player.js"></script>
</body>
</html>
